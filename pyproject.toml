[project]
name = "agentlab"
version = "0.1.0"
description = "Local multi-agent convergence loop: Planner, Coder, objective Gate, multi-model review panel, Arbiter, human signoff."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sse-starlette>=2.1",
    "openai>=1.50",
    "pypdf>=6.20.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pgvector>=0.3",
    "anthropic>=0.79",
]

[project.optional-dependencies]
adk = ["google-adk>=1.0"]
postgres = [] # compatibility: PostgreSQL is now a core capability

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11", "types-PyYAML", "httpx>=0.27"]

[project.scripts]
agentlab = "agentlab.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentlab"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["UP046", "UP047", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[[tool.mypy.overrides]]
module = ["google.*"]
ignore_missing_imports = true

[tool.mypy]
strict = true
packages = ["agentlab"]
mypy_path = "src"
