# Offline Python gate: dependencies must be preinstalled in the image.
# Network-backed dependency audit is deferred; this gate does not attest dependency security.
language: python
image: agentlab/gate-python:latest
markers: [pyproject.toml, setup.py, requirements.txt]
steps:
  - { name: build, argv: ["python", "-m", "compileall", "-q", "."], timeout_s: 600, modes: [fast, full] }
  - { name: typecheck, argv: ["mypy", "--strict", "."], timeout_s: 300, modes: [fast, full] }
  - { name: lint, argv: ["ruff", "check", "."], timeout_s: 120, modes: [fast, full] }
  - { name: format, argv: ["ruff", "format", "--diff", "."], timeout_s: 120, modes: [full] }
  - { name: test, argv: ["pytest", "-q"], timeout_s: 300, modes: [fast, full] }
