# Initial gateway validation: all chat roles use verified gpt-6-astra.
# Alias tiers remain routing labels; prices/context/tools below are provisional
# estimates inherited from the prototype, not verified gateway metadata.
# Embedding availability has not been verified.
gateway:
  base_url_env: AGENTLAB_LLM_BASE_URL
  api_key_env: AGENTLAB_LLM_API_KEY

aliases:
  root:
    model: gpt-6-astra
    max_output_tokens: 16384
    output_token_parameter: max_tokens
    supports_tools: true
    structured_output: native
    ctx_window: 400000
    cost_in_per_1m_cents: 500
    cost_out_per_1m_cents: 2000
  strong:
    model: gpt-6-astra
    max_output_tokens: 16384
    output_token_parameter: max_tokens
    supports_tools: true
    structured_output: native
    ctx_window: 400000
    cost_in_per_1m_cents: 500
    cost_out_per_1m_cents: 2000
  strong-alt:
    model: gpt-6-astra
    max_output_tokens: 16384
    output_token_parameter: max_tokens
    supports_tools: true
    structured_output: native
    ctx_window: 400000
    cost_in_per_1m_cents: 500
    cost_out_per_1m_cents: 2000
  cheap:
    model: gpt-6-astra
    max_output_tokens: 16384
    output_token_parameter: max_tokens
    supports_tools: true
    structured_output: native
    ctx_window: 400000
    cost_in_per_1m_cents: 500
    cost_out_per_1m_cents: 2000

tiers:
  root: 1
  strong: 2
  strong-alt: 2
  cheap: 3

embedding:
  model: text-embedding-3-large
  dimensions: 3072
  version: 1
