gateway:
  base_url_env: AGENTLAB_LLM_BASE_URL
  api_key_env: AGENTLAB_LLM_API_KEY

aliases:
  root:
    model: gpt-6.1
    supports_tools: true
    structured_output: native
    ctx_window: 400000
    cost_in_per_1m_cents: 500
    cost_out_per_1m_cents: 2000
  strong:
    model: gpt-5.5
    supports_tools: true
    structured_output: native
    ctx_window: 400000
    cost_in_per_1m_cents: 250
    cost_out_per_1m_cents: 1000
  strong-alt:
    model: gpt-5.5
    supports_tools: true
    structured_output: native
    ctx_window: 400000
    cost_in_per_1m_cents: 250
    cost_out_per_1m_cents: 1000
  cheap:
    model: gpt-5-mini
    supports_tools: true
    structured_output: native
    ctx_window: 400000
    cost_in_per_1m_cents: 25
    cost_out_per_1m_cents: 200

tiers:
  root: 1
  strong: 2
  strong-alt: 2
  cheap: 3

embedding:
  model: text-embedding-3-large
  dimensions: 3072
  version: 1
